name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'portfolio-mobile/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

concurrency:
  group: apk-build
  cancel-in-progress: true

jobs:
  build:
    # Build beží len ručne (Run workflow) alebo keď správa commitu obsahuje [build].
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build]')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portfolio-mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portfolio-mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Compute version
        id: ver
        run: |
          read MAJOR BASE < version.txt
          VERSION="${MAJOR}.$(( ${{ github.run_number }} - BASE ))"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('app.json','utf8'));c.expo.version='$VERSION';c.expo.android=c.expo.android||{};c.expo.android.versionCode=${{ github.run_number }};fs.writeFileSync('app.json',JSON.stringify(c,null,2));"

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: portfolio-mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk portfolio-mobile.apk
          cp portfolio-mobile.apk portfolio-mobile-v${{ steps.ver.outputs.version }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: portfolio-mobile-apk
          path: portfolio-mobile/portfolio-mobile.apk

      - name: Publish latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Latest APK (v${{ steps.ver.outputs.version }})
          files: portfolio-mobile/portfolio-mobile.apk

      - name: Publish versioned release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Verzia ${{ steps.ver.outputs.version }}
          body: "Commit ${{ github.sha }}: ${{ github.event.head_commit.message }}"
          files: portfolio-mobile/portfolio-mobile-v${{ steps.ver.outputs.version }}.apk
