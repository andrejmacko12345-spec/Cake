name: Publish Fincake privacy pages

on:
  push:
    branches: [main]
    paths:
      - 'portfolio-mobile/store/privacy-content.json'
      - 'portfolio-mobile/store/public-details.json'
      - 'portfolio-mobile/scripts/generate-public-policy.cjs'
      - '.github/workflows/deploy-privacy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/configure-pages@v5
      - name: Generate policy pages
        run: node portfolio-mobile/scripts/generate-public-policy.cjs _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
